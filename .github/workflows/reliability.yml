name: Reliability checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.4"
      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check -r amazing-psycoder/requirements-dev.txt
      - name: Validate skill package
        run: python amazing-psycoder/scripts/validate_skills.py
      - name: Run reliability regression suite
        run: python -m unittest discover -s amazing-psycoder/tests -v
      - name: Exercise representative experiment fixture
        run: python amazing-psycoder/scripts/validate_experiment.py amazing-psycoder/tests/fixtures/valid-stroop/config.yaml --json
      - name: Exercise representative analysis fixture
        run: python amazing-psycoder/scripts/validate_analysis.py amazing-psycoder/tests/fixtures/valid-analysis/config.yaml --code amazing-psycoder/tests/fixtures/valid-analysis/analysis.py --language python --json
      - name: Execute and verify representative Python analysis project
        run: |
          python -m pip install --disable-pip-version-check -r amazing-psycoder/tests/fixtures/runnable-analysis-python/requirements.lock
          python amazing-psycoder/tests/fixtures/runnable-analysis-python/analysis.py
          python amazing-psycoder/scripts/validate_analysis.py \
            amazing-psycoder/tests/fixtures/runnable-analysis-python/config.yaml \
            --code amazing-psycoder/tests/fixtures/runnable-analysis-python/analysis.py \
            --language python \
            --execution-log amazing-psycoder/tests/fixtures/runnable-analysis-python/output/analysis-run.json \
            --json
      - name: Exercise staged installer and drift check
        shell: bash
        run: |
          bash -n amazing-psycoder/install.sh
          target="$(mktemp -d)"
          trap 'rm -rf "$target"' EXIT
          ./amazing-psycoder/install.sh "$target"
          ./amazing-psycoder/install.sh --check "$target"
      - name: Compile maintained Python sources
        run: python -m compileall -q amazing-psycoder/scripts amazing-psycoder/tests
      - name: Check maintained JavaScript examples
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find amazing-psycoder/psy-exp-coder/jspsych -type f -name '*.js' \
            -not -path '*/demo/_raw/*' -print0)

  validate-r-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.0"
      - uses: r-lib/actions/setup-renv@v2
        with:
          working-directory: amazing-psycoder/tests/fixtures/runnable-analysis-r
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.4"
      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check -r amazing-psycoder/requirements-dev.txt
      - name: Execute and verify representative R analysis project
        run: |
          Rscript --vanilla amazing-psycoder/tests/fixtures/runnable-analysis-r/analysis.R
          python amazing-psycoder/scripts/validate_analysis.py \
            amazing-psycoder/tests/fixtures/runnable-analysis-r/config.yaml \
            --code amazing-psycoder/tests/fixtures/runnable-analysis-r/analysis.R \
            --language r \
            --execution-log amazing-psycoder/tests/fixtures/runnable-analysis-r/output/analysis-run.json \
            --json
